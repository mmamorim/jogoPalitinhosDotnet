<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Bar do Seu Zé – jogo da porrinha</title>
  <desc id="desc">Mesa de bar com um pastel, um paliteiro e palitos espalhados. Uma mão humana e uma mão de robô, fechadas, disputam a porrinha, cada uma com um balão de palpite.</desc>

  <defs>
    <pattern id="azulejos" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="#2E8B6E"/>
      <rect x="2" y="2" width="46" height="46" rx="3" fill="#34997A"/>
      <path d="M0 0H50M0 0V50" stroke="#E8F2EC" stroke-width="3"/>
    </pattern>

  </defs>

  <!-- parede -->
  <rect width="1200" height="630" fill="#F4E3C3"/>
  <rect y="300" width="1200" height="330" fill="url(#azulejos)"/>
  <rect y="292" width="1200" height="14" fill="#1F5E4B"/>

  <!-- relógio -->
  <circle cx="170" cy="160" r="52" fill="#FFFDF6" stroke="#5B3A1E" stroke-width="8"/>
  <g stroke="#5B3A1E" stroke-width="5" stroke-linecap="round">
    <line x1="170" y1="160" x2="170" y2="125"/>
    <line x1="170" y1="160" x2="196" y2="172"/>
  </g>
  <circle cx="170" cy="160" r="5" fill="#5B3A1E"/>

  <!-- placa -->
  <g stroke="#5B3A1E" stroke-width="4">
    <line x1="440" y1="0" x2="460" y2="48"/>
    <line x1="760" y1="0" x2="740" y2="48"/>
  </g>
  <rect x="370" y="44" width="460" height="104" rx="14" fill="#8B5A2B" stroke="#5B3A1E" stroke-width="7"/>
  <text x="600" y="113" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#FCE9B8" letter-spacing="1">BAR DO SEU ZÉ</text>

  <!-- lousa -->
  <rect x="930" y="110" width="200" height="140" rx="8" fill="#2F3B36" stroke="#8B5A2B" stroke-width="10"/>
  <g font-family="'Comic Sans MS', 'Segoe Print', 'Trebuchet MS', sans-serif" fill="#F3F1EA" text-anchor="middle">
    <text x="1030" y="160" font-size="24">SEXTA:</text>
    <text x="1030" y="198" font-size="28" font-weight="bold">PORRINHA</text>
    <text x="1030" y="230" font-size="18">às 19h</text>
  </g>

  <!-- mesa -->
  <rect x="150" y="490" width="32" height="140" fill="#6E4220"/>
  <rect x="1018" y="490" width="32" height="140" fill="#6E4220"/>
  <polygon points="170,398 1030,398 1100,470 100,470" fill="#B5713A"/>
  <rect x="100" y="470" width="1000" height="26" fill="#8A5428"/>
  <g stroke="#9E5F2D" stroke-width="3" fill="none" opacity="0.6">
    <path d="M260 420 Q600 410 940 420"/>
    <path d="M200 448 Q600 438 1000 448"/>
  </g>

  <!-- palitos espalhados -->
  <g stroke="#E8C07A" stroke-width="5" stroke-linecap="round">
    <line x1="660" y1="458" x2="718" y2="450"/>
    <line x1="700" y1="438" x2="748" y2="452"/>
    <line x1="740" y1="460" x2="792" y2="466"/>
  </g>

  <!-- paliteiro -->
  <g stroke="#E8C07A" stroke-width="4" stroke-linecap="round">
    <line x1="588" y1="362" x2="578" y2="302"/>
    <line x1="596" y1="362" x2="594" y2="294"/>
    <line x1="604" y1="362" x2="608" y2="298"/>
    <line x1="612" y1="362" x2="624" y2="306"/>
    <line x1="600" y1="362" x2="586" y2="310"/>
  </g>
  <path d="M568 362 V448 A32 9 0 0 0 632 448 V362 Z" fill="#C0392B"/>
  <rect x="568" y="392" width="64" height="12" fill="#F7F2E8"/>
  <ellipse cx="600" cy="362" rx="32" ry="9" fill="#8E2A20"/>

  <!-- pastel -->
  <ellipse cx="470" cy="450" rx="78" ry="17" fill="#FFFFFF" stroke="#D6D6D6" stroke-width="3"/>
  <path d="M410 446 Q470 380 530 446 Z" fill="#EBAE4A" stroke="#C98A2A" stroke-width="3"/>
  <path d="M416 440 Q470 386 524 440" fill="none" stroke="#C98A2A" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- mão humana (esquerda) -->
  <g>
      <!-- manga -->
      <rect x="-30" y="372" width="300" height="70" rx="12" fill="#3B6EA5"/>
      <!-- mão fechada -->
      <rect x="262" y="366" width="108" height="86" rx="30" fill="#E0A67A" stroke="#B97A52" stroke-width="2.5"/>
      <!-- dedos dobrados -->
      <rect x="338" y="368" width="44" height="23" rx="11" fill="#E0A67A" stroke="#B97A52" stroke-width="2.5"/>
      <rect x="342" y="389" width="44" height="22" rx="11" fill="#E0A67A" stroke="#B97A52" stroke-width="2.5"/>
      <rect x="340" y="409" width="44" height="22" rx="11" fill="#E0A67A" stroke="#B97A52" stroke-width="2.5"/>
      <rect x="334" y="429" width="42" height="22" rx="11" fill="#E0A67A" stroke="#B97A52" stroke-width="2.5"/>
      <!-- polegar -->
      <rect x="284" y="352" width="82" height="26" rx="13" fill="#E0A67A" stroke="#B97A52" stroke-width="2.5"/>
  </g>

  <!-- mão de robô (direita, espelhada) -->
  <g transform="translate(1200,0) scale(-1,1)">
      <!-- manga -->
      <rect x="-30" y="372" width="300" height="70" rx="12" fill="#5E6B78"/>
      <!-- mão fechada -->
      <rect x="262" y="366" width="108" height="86" rx="30" fill="#A9B6C3" stroke="#6C7A88" stroke-width="2.5"/>
      <!-- dedos dobrados -->
      <rect x="338" y="368" width="44" height="23" rx="11" fill="#A9B6C3" stroke="#6C7A88" stroke-width="2.5"/>
      <rect x="342" y="389" width="44" height="22" rx="11" fill="#A9B6C3" stroke="#6C7A88" stroke-width="2.5"/>
      <rect x="340" y="409" width="44" height="22" rx="11" fill="#A9B6C3" stroke="#6C7A88" stroke-width="2.5"/>
      <rect x="334" y="429" width="42" height="22" rx="11" fill="#A9B6C3" stroke="#6C7A88" stroke-width="2.5"/>
      <!-- polegar -->
      <rect x="284" y="352" width="82" height="26" rx="13" fill="#A9B6C3" stroke="#6C7A88" stroke-width="2.5"/>
    <g fill="#D7DEE5">
      <circle cx="60" cy="407" r="6"/>
      <circle cx="140" cy="407" r="6"/>
      <circle cx="220" cy="407" r="6"/>
    </g>
    <rect x="236" y="372" width="12" height="70" fill="#47525D"/>
  </g>

  <!-- balões de palpite -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle">
    <circle cx="300" cy="305" r="9" fill="#FFFFFF" stroke="#333" stroke-width="3"/>
    <circle cx="318" cy="250" r="42" fill="#FFFFFF" stroke="#333" stroke-width="3"/>
    <text x="318" y="267" font-size="46" fill="#3B6EA5">4</text>

    <circle cx="900" cy="305" r="9" fill="#FFFFFF" stroke="#333" stroke-width="3"/>
    <circle cx="882" cy="250" r="42" fill="#FFFFFF" stroke="#333" stroke-width="3"/>
    <text x="882" y="267" font-size="46" fill="#5E6B78">2</text>
  </g>
</svg>
